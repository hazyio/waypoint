[package]
name = "waypoint"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
dialoguer = "0.12.0"
console = "0.16.6"
whoami = "2.1.3"
dirs = "7.0.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
noyalib = { version = "0.0.57" }



[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.clippy]
todo = "deny"
redundant_clone = "deny"

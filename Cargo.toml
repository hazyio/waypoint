[package]
name = "waypoint"
version = "0.1.0"
edition = "2024"
description = "Interactive shell wrapper that routes commands by config"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/hazyio/waypoint"
keywords = ["shell", "cli", "workflow", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
whoami = "2.1.3"
dirs = "7.0.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
noyalib = { version = "0.0.57" }



[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
todo = "deny"
redundant_clone = "deny"
